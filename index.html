<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gateflow · Sanjai International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>
:root{
  --accent:#FF6A1A; --accent-soft:rgba(255,106,26,.14); --accent-2:#FF8F52;
  --bg:#F4EEE6; --ink:#221C18; --ink-2:#4A413B; --muted:#8A7E74; --line:rgba(60,40,25,.10);
  --glass:rgba(255,251,246,.70); --glass-strong:rgba(255,251,246,.86); --glass-border:rgba(255,255,255,.75);
  --shadow:0 10px 34px rgba(80,50,25,.14), 0 2px 6px rgba(80,50,25,.06);
  --ok:#2E9D6A; --warn:#E3A21A; --bad:#D9483B; --info:#3D7FD9;
  --r:18px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
body.night{
  --bg:#14110F; --ink:#F6EEE6; --ink-2:#D6CBC1; --muted:#9C9087; --line:rgba(255,235,215,.10);
  --glass:rgba(30,25,22,.62); --glass-strong:rgba(34,28,25,.86); --glass-border:rgba(255,230,210,.12);
  --shadow:0 10px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); --accent-soft:rgba(255,106,26,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:var(--r)}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.ui{position:fixed;z-index:10}

/* ---------- top bar ---------- */
#topbar{top:12px;left:12px;right:12px;height:60px;display:flex;align-items:center;gap:14px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.search{position:relative;flex:1;max-width:300px;min-width:140px}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong);padding:0 12px 0 34px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px;flex-shrink:0}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.chip{height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);font-weight:600}
.chip small{color:var(--muted);font-weight:500}
.icon-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--line)}
.icon-btn svg,.chip svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.clock{text-align:right;padding:0 6px;line-height:1.1}
.clock b{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em}
.clock small{display:block;font-size:10.5px;color:var(--muted)}
.user{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#FFB27A);color:#fff;font-weight:800;display:grid;place-items:center;font-size:12px}
.user b{display:block;font-size:12.5px}.user small{display:block;font-size:10.5px;color:var(--muted)}
.menu{position:relative}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:260px;padding:6px;display:none;z-index:30;background:var(--glass-strong);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:14px;max-height:60vh;overflow:auto}
.dropdown.open{display:block;animation:pop .18s ease-out}
.search .dropdown{left:0;right:auto;width:100%;min-width:280px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.dd-item:hover,.dd-item.active{background:var(--accent-soft)}
.dd-item .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--line);flex-shrink:0;font-size:15px}
.dd-item b{display:block;font-weight:700;font-size:12.5px}
.dd-item small{display:block;color:var(--muted);font-size:11px}
.dd-item .tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dd-item.sel .ico{background:var(--accent);color:#fff}
.alert-item{display:flex;gap:10px;padding:10px;border-radius:10px}
.alert-item+.alert-item{border-top:1px solid var(--line)}
.alert-item i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert-item b{display:block;font-size:12.5px}.alert-item small{color:var(--muted);font-size:11px}
.dd-head{padding:8px 10px 6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- KPI ---------- */
#kpis{top:84px;left:12px;display:flex;gap:10px}
.kpi{width:178px;padding:12px 14px 10px}
.kpi .k-lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .k-sub{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
.kpi svg{width:64px;height:20px}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}

/* ---------- panels ---------- */
#sheet{display:contents}
.sheet-handle,.sheet-tabs{display:none}
.panel{position:fixed;z-index:10}
#detail{top:84px;right:12px;width:320px;max-height:calc(100vh - 360px);overflow:auto;padding:16px}
#tracker{left:12px;bottom:12px;width:330px;padding:14px 16px}
#table{left:354px;right:12px;bottom:12px;height:232px;padding:10px 12px 8px;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.p-title{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700;background:var(--line);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(46,157,106,.12)}
.pill.warn{color:#B67C00;background:rgba(227,162,26,.15)}
.pill.bad{color:var(--bad);background:rgba(217,72,59,.12)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.info{color:var(--info);background:rgba(61,127,217,.12)}
.pill.idle{color:var(--muted)}
.d-hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.d-ico{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:0 6px 16px rgba(255,106,26,.35)}
.d-hero h2{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.d-hero p{color:var(--muted);font-size:12px;margin-top:3px}
.d-close{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.d-close:hover{background:var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--line);border-radius:12px;padding:9px 11px}
.stat small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:15px;font-weight:800;margin-top:2px;font-family:var(--mono);letter-spacing:-.02em}
.stat.wide{grid-column:span 2}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:12px}
.rows div span:first-child{color:var(--muted)}
.rows div span:last-child{font-weight:700;text-align:right}
.btn{height:34px;padding:0 14px;border-radius:10px;font-weight:700;background:var(--line);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* tracker */
.steps{display:flex;flex-direction:column;gap:2px;position:relative}
.step{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:5px 0;position:relative}
.step .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--glass-strong);z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.done .dot::after{content:"";width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.step.active .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,106,26,.08)}}
.step:not(:last-child)::before{content:"";position:absolute;left:8px;top:23px;height:calc(100% - 14px);width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--ok)}
.step b{font-size:12.5px;font-weight:700}
.step .s-sub{font-size:10.5px;color:var(--muted);display:block}
.step .s-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right}
.step .s-time small{display:block;color:var(--muted);font-size:10px}
.step.pending b{color:var(--muted)}
.tr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tr-flight{font-size:15px;font-weight:800}
.tr-flight small{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:6px}
.tr-prog{height:4px;background:var(--line);border-radius:2px;margin:6px 0 10px;overflow:hidden}
.tr-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}
.tr-picker{display:flex;gap:4px}
.tr-picker button{height:24px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;background:var(--line);color:var(--ink-2)}
.tr-picker button.on{background:var(--accent);color:#fff}

/* table */
.tabs{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.tabs button{height:28px;padding:0 12px;border-radius:8px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tabs .count{font-size:10px;opacity:.75;margin-left:4px}
.tabs .live{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.tbl-wrap{flex:1;overflow:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--glass-strong);text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 10px;z-index:1}
td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row.sel td{background:var(--accent-soft)}
tr.row.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
td.mono{font-family:var(--mono);font-size:11.5px}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.flabel{position:absolute;transform:translate(-50%,-100%);padding:6px 10px;border-radius:10px;background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);box-shadow:var(--shadow);white-space:nowrap;font-size:12px;font-weight:700;margin-top:-14px}
.flabel small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.flabel::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:inherit;border-right:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border)}
.flabel .acc{color:var(--accent)}
.hlabel{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--glass);padding:3px 7px;border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.85}
#hint{position:fixed;left:calc(50% + 10px);transform:translateX(-50%);bottom:258px;padding:8px 14px;font-size:11.5px;color:var(--ink-2);z-index:9;transition:opacity 1s;pointer-events:none}
#flash{position:fixed;inset:0;background:#E8EEFF;opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen}
#loader{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;transition:opacity .8s}
#loader .l-in{text-align:center}
#loader svg{width:64px;height:64px;animation:spin 2.4s linear infinite}
#loader p{margin-top:14px;font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
#err{display:none;position:fixed;inset:auto 12px 12px 12px;z-index:200;padding:12px;background:#fff3ee;color:#7a2c0a;border-radius:12px;font-size:12px}

/* ---------- tablet ---------- */
@media (max-width:1180px){
  .user div,.clock small{display:none}
  #table{left:354px}
  .kpi{width:156px}
}
@media (max-width:980px){
  .search{max-width:200px}
  .seg button{padding:0 9px}
}
/* ---------- mobile ---------- */
@media (max-width:760px){
  body{font-size:12.5px}
  #topbar{top:8px;left:8px;right:8px;height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px;row-gap:8px}
  .brand span{display:none}
  .brand svg{width:28px;height:28px}
  .tb-right{gap:6px}
  .user{display:none}
  .clock b{font-size:15px}
  .search{order:5;flex:1 1 100%;max-width:none}
  .search input{height:34px}
  #areas{order:6;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  #areas::-webkit-scrollbar{display:none}
  #areas button{flex:1;height:28px;font-size:12px}
  .chip{padding:0 9px;height:34px}.chip small{display:none}
  .icon-btn{width:34px;height:34px}
  #weather-label{display:none}
  .dropdown{position:fixed;left:8px;right:8px;top:auto;min-width:0}
  #kpis{top:156px;left:8px;right:8px;gap:6px}
  .kpi{flex:1;width:auto;padding:8px 10px;border-radius:14px}
  .kpi .k-val{font-size:18px}
  .kpi .k-sub svg,.kpi .k-sub .muted{display:none}
  .kpi .k-lab{font-size:9px}
  #hint{display:none}
  #sheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:12;height:var(--sheet-h,44vh);background:var(--glass-strong);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(60,35,15,.2);border-top:1px solid var(--glass-border);transition:height .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  #sheet.dragging{transition:none}
  .sheet-handle{display:block;padding:9px 0 6px;cursor:grab;touch-action:none}
  .sheet-handle::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;margin:0 auto}
  .sheet-tabs{display:flex;gap:4px;padding:0 12px 8px;touch-action:none}
  .sheet-tabs button{flex:1;height:32px;border-radius:10px;font-weight:700;color:var(--muted);background:var(--line)}
  .sheet-tabs button.on{background:var(--accent);color:#fff}
  #sheet .panel{position:static;width:auto;max-height:none;height:auto;flex:1;min-height:0;overflow:auto;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;padding:4px 16px 16px;display:none}
  #sheet .panel.show{display:block}
  #sheet #table.show{display:flex}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="flash"></div>
<div id="labels"></div>
<div id="loader"><div class="l-in">
  <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#FF6A1A" stroke-width="5" stroke-dasharray="120 60" stroke-linecap="round"/></svg>
  <p>Building Sanjai International…</p></div></div>
<div id="err"></div>

<header id="topbar" class="ui glass">
  <div class="brand">
    <svg viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="#FF6A1A"/><path d="M9 25c6-1 11-5 15-11l3 1-3 7 7 1 2-3h2l-1 5 1 5h-2l-2-3-7 1 3 7-3 1c-4-6-9-10-15-11z" fill="#fff" transform="rotate(-20 20 20) translate(-2 -3)"/></svg>
    <div><b>Gateflow</b><span>Sanjai International · SJI</span></div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" placeholder="Search flights, stands, vehicles…" autocomplete="off" spellcheck="false">
    <div class="dropdown" id="search-dd"></div>
  </div>
  <nav id="areas" class="seg">
    <button data-area="terminal" class="on">Terminal</button>
    <button data-area="cargo">Cargo</button>
    <button data-area="hangar">Hangar</button>
    <button data-area="runway">Runway</button>
    <button data-area="landside">Landside</button>
  </nav>
  <div class="tb-right">
    <div class="menu">
      <button class="chip" id="weather-btn"><span id="weather-ico">☀️</span><span id="weather-label">Summer</span><small id="weather-temp">34°C</small></button>
      <div class="dropdown" id="weather-dd"></div>
    </div>
    <div class="clock"><b id="clock">--:--</b><small id="date">LT</small></div>
    <div class="menu">
      <button class="icon-btn" id="alerts-btn" title="Alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="alerts-count">0</span></button>
      <div class="dropdown" id="alerts-dd"></div>
    </div>
    <button class="icon-btn" id="daynight" title="Toggle day / night"></button>
    <div class="user"><div class="avatar">RI</div><div><b>R. Iyer</b><small>Apron Control · Shift B</small></div></div>
  </div>

/* =====================================================================
   PATHS: rounded polylines sampled to ~1 m, with curvature for speed
   ===================================================================== */
class Path {

    for (let i = 1; i < n; i++) this.len[i] = this.len[i - 1] + Math.hypot(this.p[i][0] - this.p[i - 1][0], this.p[i][1] - this.p[i - 1][1]);

// flat stripe between two points
function stripe(x0, z0, x1, z1, w, m, y = Y.mark) {
  const L = Math.hypot(x1 - x0, z1 - z0);
  const s = flat(w, L, m, (x0 + x1) / 2, (z0 + z1) / 2, y);
  s.rotation.y = Math.atan2(x1 - x0, z1 - z0);
  return s;
}
function dashed(x0, z0, x1, z1, w, dash, gap, m, y = Y.mark) {
  const L = Math.hypot(x1 - x0, z1 - z0), ux = (x1 - x0) / L, uz = (z1 - z0) / L;
  for (let s = 0; s < L - dash; s += dash + gap) stripe(x0 + ux * s, z0 + uz * s, x0 + ux * (s + dash), z0 + uz * (s + dash), w, m, y);
}
function polyStripe(path, w, m, y = Y.mark, step = 3) {
  for (let s = 0; s < path.L; s += step) {
    const a = path.at(s), b = path.at(Math.min(path.L, s + step + 0.3));
    stripe(a.x, a.z, b.x, b.z, w, m, y);
  }
}

function setJetBridge(st, t) {
  const jb = st.jb; jb.t = t;
  // target cab positions (world, relative to rotunda root)
  const rx = st.x + 10, rz = 5.5;
  const docked = { x: st.x + 3.6, z: STAND_Z + 12.8 }, parked = { x: st.x + 9, z: -3 };
  const cx = lerp(parked.x, docked.x, t), cz = lerp(parked.z, docked.z, t);
  const dx = cx - rx, dz = cz - rz, L = Math.hypot(dx, dz);
  jb.tunnel.rotation.y = Math.atan2(dx, dz) + Math.PI;
  jb.tube.scale.z = L; jb.tube.position.z = -L / 2;
  jb.tubeStripe.scale.z = L; jb.tubeStripe.position.z = -L / 2;
  jb.cab.position.z = -L; jb.cab.rotation.y = Math.PI / 2 - jb.tunnel.rotation.y;
  jb.leg.position.set(dx * 0.82, 0, dz * 0.82);
  jb.leg.rotation.y = jb.tunnel.rotation.y;
}
stands.forEach(s => setJetBridge(s, 0));

// convex prism from (x,z) outline with thickness t (flat shaded)
function slab(pts, t) {
  const n = pts.length, pos = [];
  const T = pts.map(p => [p[0], t / 2, p[1]]), B = pts.map(p => [p[0], -t / 2, p[1]]);
  // ensure top face points up
  const a = T[0], b = T[1], c = T[2];
  const ny = (b[2] - a[2]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[2] - a[2]);
  if (ny < 0) { T.reverse(); B.reverse(); }
  for (let i = 1; i < n - 1; i++) { pos.push(...T[0], ...T[i], ...T[i + 1]); pos.push(...B[0], ...B[i + 1], ...B[i]); }
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; pos.push(...T[i], ...B[i], ...B[j], ...T[i], ...B[j], ...T[j]); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}

const pad = n => String(Math.floor(n)).padStart(2, '0');

function lock(name, who) { if (!LOCKS[name] || LOCKS[name] === who) { LOCKS[name] = who; return true; } return false; }

const zones = [];
function reserveZone(owner, x0, x1, z0, z1) { const z = { owner, x0, x1, z0, z1 }; zones.push(z); return z; }

    for (const d of TASK_DEF) h += `<div class="step pending"><div class="dot"></div><div><b>${d.label}</b><span class="s-sub">${d.sub}</span></div><div class="s-time">${fmtClock(eta + d.plan * 60)}<small>planned</small></div></div>`;
    $('#tracker').innerHTML = h + '</div>'; return;
  }
  const p = taProgress(a), T = ta.tasks;
  const estOff = T.push.start || (SIM.clock + Math.max(0, (1 - p) * 95) * SIM.rate);
  const late = Math.round((estOff - a.dep.std) / 60);
  h += `<div class="tr-top"><div class="tr-flight">${a.dep.no}<small>Stand ${a.stand ? a.stand.id : '—'} · ${a.reg} · to ${a.dep.to}</small></div>${late > 3 ? pill('warn', '+' + late + ' min') : pill('ok', 'On time')}</div>`;
  h += `<div class="tr-prog"><i style="width:${p * 100}%"></i></div><div class="steps">`;
  const defs = TASK_DEF.slice();
  if (T.deice && T.deice.state !== 'skip') defs.splice(5, 0, { key: 'deice', label: 'De-ice', sub: 'Type I / IV · DI-01', plan: 38 });
  for (const d of defs) {
    const t = T[d.key], cls = t.state === 'done' ? 'done' : t.state === 'active' ? 'active' : 'pending';
    const plan = t.plan || ta.onblock + d.plan * 60;
    let time;
    if (t.state === 'done') time = `${fmtClock(t.end)}<small>${d.key === 'onblock' ? 'actual' : 'done · plan ' + fmtClock(plan)}</small>`;
    else if (t.state === 'active') time = `${d.key === 'push' ? 'Moving' : Math.round(t.p * 100) + '%'}<small>since ${fmtClock(t.start)}</small>`;
    else time = `${fmtClock(plan)}<small>planned</small>`;
    h += `<div class="step ${cls}"><div class="dot"></div><div><b>${d.label}</b><span class="s-sub">${d.sub}</span></div><div class="s-time">${time}</div></div>`;
  }
  $('#tracker').innerHTML = h + '</div>';
}
$('#tracker').addEventListener('click', e => { const b = e.target.closest('[data-ac]'); if (b) { trackerFor = fleet.find(f => f.reg === b.dataset.ac); renderTracker(); } });

/* ---------- live table ---------- */
let tblTab = 'stands';
function renderTable() {
  let head = '', body = '';
  const row = (sel, cells) => `<tr class="row${selected === sel ? ' sel' : ''}" data-id="${esc(sel.id)}">${cells.join('')}</tr>`;

      const prog = a && a.ta ? Math.round(taProgress(a) * 100) : null;
      body += row(st.sel, [td('<b>' + st.id + '</b>'), td(status), td(a ? a.dep.no : r ? r.arr.no : '—', 1), td(a ? a.reg : r ? r.reg : '—', 1), td(a ? 'STD ' + fmtClock(a.dep.std) : r ? 'ETA ' + fmtClock(etaOf(r)) : '—', 1), td(jb > 0.98 ? 'Docked' : jb > 0.02 ? 'Moving' : 'Retracted'), td(prog != null ? `<div class="bar" style="width:90px;margin:0"><i style="width:${prog}%"></i></div>` : '—')]);
    }
  } else if (tblTab === 'vehicles') {
    head = '<th>ID</th><th>Type</th><th>Status</th><th>Assigned</th><th>Speed</th><th>Give-way</th>';
    for (const v of gse) body += row(v.sel, [td('<b>' + v.id + '</b>', 1), td(v.desc.split('·')[0]), td(pill(gseCls(v.state), v.stateLabel)), td(v.ac ? `${v.ac.flightNo} · ${v.ac.stand ? v.ac.stand.id : ''}` : '—', 1), td(kmh(v.fol.v) + ' km/h', 1), td(v.zoneHold ? pill('warn', 'Held · aircraft') : v.agent.blockedBy ? pill('warn', 'Yielding') : '—')]);
    for (const f of forklifts) body += row(f.sel, [td('<b>' + f.id + '</b>', 1), td('Forklift'), td(pill(f.stopped ? 'ok' : 'info', f.stopped ? 'Handling ULD' : 'Moving')), td('SJ 1907 · C1', 1), td(kmh(f.v) + ' km/h', 1), td('—')]);
    const bus = landside.find(m => m.kind === 'bus');
    body += row(bus.sel, [td('<b>BUS 07</b>', 1), td('Airport Express'), td(pill(bus.stopped ? 'warn' : 'ok', bus.stopped ? 'At bay B1' : 'In service')), td('Route 1 · City', 1), td(kmh(bus.v) + ' km/h', 1), td('—')]);
  } else {
    head = '<th>Flight</th><th>Route</th><th>Reg</th><th>Sched</th><th>Est / Act</th><th>Status</th><th>Stand</th>';
    const list = [];

      if (a.prevDep) list.push({ sel: a.sel, no: a.prevDep.no, route: 'SJI → ' + a.prevDep.to, reg: a.reg, t: a.prevDep.std, act: a.prevDep.atot || a.prevDep.atd, st: pill('idle', 'Departed'), stand: '—' });
      const inb = ['away', 'approach', 'landing', 'taxiin', 'hold'].includes(a.phase);
      list.push({ sel: a.sel, no: a.arr.no, route: a.arr.from + ' → SJI', reg: a.reg, t: a.arr.sta, act: a.arr.ata || (inb ? etaOf(a) : null), st: pill(inb ? phaseCls(a.phase) : 'ok', inb ? a.statusLabel : 'Arrived'), stand: a.stand ? a.stand.id : 'TBA' });
      list.push({ sel: a.sel, no: a.dep.no, route: 'SJI → ' + a.dep.to, reg: a.reg, t: a.dep.std, act: a.dep.atd || null, st: pill(a.dep.status === 'Boarding' ? 'acc' : a.dep.status === 'Departed' ? 'idle' : 'info', a.dep.status), stand: a.stand ? a.stand.id : 'TBA' });

$('#live').addEventListener('click', e => { const r = e.target.closest('tr.row'); if (!r) return; const s = SEL.find(x => x.id === r.dataset.id); if (s) select(s); });

/* ---------- KPIs ---------- */
function spark(id, data, color = '#FF6A1A') {
  const el = $(id), w = 64, hh = 20, mn = Math.min(...data), mx = Math.max(...data), r = mx - mn || 1;
  const pts = data.map((v, i) => [i / (data.length - 1) * w, hh - 2 - (v - mn) / r * (hh - 4)]);
  el.setAttribute('viewBox', `0 0 ${w} ${hh}`);
  el.innerHTML = `<path d="M${pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join(' L')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.2" fill="${color}"/>`;
}
const movHist = [180, 188, 194, 199, 203, 207, 211, 214];
function renderKPIs() {
  const otp = Math.round(STATS.onTime / STATS.total * 100), tat = Math.round(STATS.tats.reduce((a, b) => a + b, 0) / STATS.tats.length);
  $('#kpi-otp').innerHTML = `${otp}<small>%</small>`;
  const d = otp - 89; $('#kpi-otp-d').className = 'delta ' + (d >= 0 ? 'up' : 'down'); $('#kpi-otp-d').textContent = (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + ' vs avg';
  $('#kpi-tat').innerHTML = `${tat}<small>min</small>`; $('#kpi-tat-d').textContent = 'target 45 · last ' + STATS.tats.at(-1);
  $('#kpi-mov').textContent = STATS.movements; $('#kpi-mov-d').textContent = 'stands ' + stands.filter(s => s.aircraft).length + '/5';
  if (movHist.at(-1) !== STATS.movements) { movHist.push(STATS.movements); if (movHist.length > 12) movHist.shift(); }
  spark('#spark-otp', STATS.otpHist); spark('#spark-tat', STATS.tats, '#8A7E74'); spark('#spark-mov', movHist);
}

/* ---------- top bar: clock, weather, alerts, day/night, search ---------- */
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function renderClock() {
  $('#clock').textContent = fmtClock(SIM.clock);
  const d = new Date(Date.now() + Math.floor(SIM.clock / 86400) * 864e5);
  $('#date').textContent = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} · IST ×${SIM.rate}`;
}
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function renderDayNight() { $('#daynight').innerHTML = env.night > 0.5 ? SUN_SVG : MOON_SVG; $('#daynight').title = env.night > 0.5 ? 'Skip to day' : 'Skip to night'; }
function shiftTimes(d) {
  const seen = new Set();
  const sh = (o, keys) => { if (!o || seen.has(o)) return; seen.add(o); for (const k of keys) if (typeof o[k] === 'number') o[k] += d; };
  for (const a of fleet) {
    sh(a.arr, ['sta', 'ata', 'onblock']); sh(a.dep, ['std', 'atd', 'atot']); sh(a.prevDep, ['std', 'atd', 'atot']);
    for (const ta of [a.ta, a.lastTA]) { if (!ta) continue; sh(ta, ['onblock', 'plan']); if (ta.tasks) for (const t of Object.values(ta.tasks)) sh(t, ['start', 'end', 'plan']); }
  }
  sh(freighterInfo, ['std']);
}
$('#daynight').addEventListener('click', () => {
  const now = ((SIM.clock % 86400) + 86400) % 86400, target = (env.night > 0.5 ? 11.5 : 21) * 3600;
  let d = target - now; if (d < 0) d += 86400;
  SIM.skip = d; SIM.skipTotal = d;
});
function renderWeatherUI() {
  const S = SEASONS[WEATHER.season];
  $('#weather-ico').textContent = S.ico; $('#weather-label').textContent = S.label; $('#weather-temp').textContent = S.temp + '°C';
  $('#weather-dd').innerHTML = '<div class="dd-head">Season &amp; weather</div>' + Object.entries(SEASONS).map(([k, s]) => `<button class="dd-item${k === WEATHER.season ? ' sel' : ''}" data-season="${k}"><span class="ico">${s.ico}</span><span><b>${s.label}</b><small>${s.temp}°C · vis ${s.vis}</small></span>${k === WEATHER.season ? '<span class="tag">Active</span>' : ''}</button>`).join('');
}
function renderAlerts() {
  const c = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', info: 'var(--info)' };
  $('#alerts-dd').innerHTML = '<div class="dd-head">Alerts &amp; events</div>' + (ALERTS.map(a => `<div class="alert-item"><i style="background:${c[a.level]}"></i><div><b>${esc(a.title)}</b><small>${a.time} · ${esc(a.sub)}</small></div></div>`).join('') || '<div class="alert-item">No alerts</div>');
  $('#alerts-count').textContent = alertsUnread; $('#alerts-count').style.display = alertsUnread ? '' : 'none';
  alertsDirty = false;
}
function toggleDD(id, force) {
  for (const d of ['#weather-dd', '#alerts-dd', '#search-dd']) if (d !== id) $(d).classList.remove('open');
  const el = $(id); if (el) el.classList.toggle('open', force ?? !el.classList.contains('open'));
}
$('#weather-btn').addEventListener('click', e => { e.stopPropagation(); toggleDD('#weather-dd'); });
$('#weather-dd').addEventListener('click', e => { const b = e.target.closest('[data-season]'); if (b) { setSeason(b.dataset.season); toggleDD('#weather-dd', false); } });
$('#alerts-btn').addEventListener('click', e => { e.stopPropagation(); alertsUnread = 0; renderAlerts(); toggleDD('#alerts-dd'); });
document.addEventListener('click', e => { if (!e.target.closest('.menu') && !e.target.closest('.search')) toggleDD('#none', false); });
$$('#areas button').forEach(b => b.addEventListener('click', () => { select(null); areaFly(b.dataset.area); }));
// search
let searchIdx = 0, searchRes = [];
const nameOf = s => s.name;
function runSearch() {
  const q = $('#search').value.trim().toLowerCase();
  let res = SEL.filter(s => !q || [s.name, s.id, s.sub, s.ref && s.ref.arr ? s.ref.arr.no + ' ' + s.ref.dep.no + ' ' + s.ref.dep.city + ' ' + s.ref.arr.city : ''].join(' ').toLowerCase().includes(q));
  if (!q) res = res.filter(s => ['aircraft', 'stand', 'building', 'freighter'].includes(s.kind));
  searchRes = res.slice(0, 9); searchIdx = 0;
  const tag = { aircraft: 'Flight', stand: 'Stand', building: 'Facility', vehicle: 'GSE', landside: 'Landside', freighter: 'Cargo', mro: 'MRO' };
  $('#search-dd').innerHTML = (q ? '' : '<div class="dd-head">Quick jump</div>') + (searchRes.map((s, i) => {
    const sub = s.kind === 'aircraft' ? `${s.ref.reg} · ${s.ref.statusLabel}` : s.kind === 'vehicle' && s.ref.stateLabel ? `${s.sub} · ${s.ref.stateLabel}` : s.sub;
    return `<button class="dd-item${i === searchIdx ? ' active' : ''}" data-i="${i}"><span class="ico">${s.icon}</span><span><b>${esc(nameOf(s))}</b><small>${esc(sub)}</small></span><span class="tag">${tag[s.kind] || ''}</span></button>`;
  }).join('') || '<div class="alert-item muted">No matches</div>');
  toggleDD('#search-dd', true);
}
$('#search').addEventListener('input', runSearch);
$('#search').addEventListener('focus', runSearch);
$('#search').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); searchIdx = clamp(searchIdx + (e.key === 'ArrowDown' ? 1 : -1), 0, searchRes.length - 1); $$('#search-dd .dd-item').forEach((b, i) => b.classList.toggle('active', i === searchIdx)); }
  if (e.key === 'Enter' && searchRes[searchIdx]) { select(searchRes[searchIdx]); $('#search').blur(); toggleDD('#search-dd', false); }
  if (e.key === 'Escape') { $('#search').blur(); toggleDD('#search-dd', false); }
});
$('#search-dd').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { select(searchRes[+b.dataset.i]); $('#search').value = ''; toggleDD('#search-dd', false); } });

/* ---------- mobile bottom sheet ---------- */
let sheetH = 0.42;
function setSheetH(h) { sheetH = clamp(h, 0.12, 0.86); $('#sheet').style.setProperty('--sheet-h', (sheetH * 100).toFixed(1) + 'vh'); }

$('#sheet-tabs').addEventListener('click', e => { const b = e.target.closest('[data-sheet]'); if (b) { setSheetTab(b.dataset.sheet); if (sheetH < 0.3) setSheetH(0.42); } });
{
  const hd = $('#sheet-handle'); let st = null;

  hd.addEventListener('pointermove', e => { if (st) setSheetH(st.h + (st.y - e.clientY) / innerHeight); });
  const end = () => { if (!st) return; st = null; $('#sheet').classList.remove('dragging'); const snaps = [0.14, 0.42, 0.82]; setSheetH(snaps.reduce((a, b) => Math.abs(b - sheetH) < Math.abs(a - sheetH) ? b : a)); };
  hd.addEventListener('pointerup', end); hd.addEventListener('pointercancel', end);

buildGlow();

renderAlerts(); renderDetail(); renderTracker(); renderTable(); renderKPIs(); renderClock();
{
  const a = AREAS.terminal;
  controls.target.set(...a.t);
  camera.position.copy(controls.target).add(_v.setFromSpherical(_sph.set(isMobile() ? a.d * 1.5 : a.d * 1.1, a.pol - 0.05, a.az)));

}
{

  const q = new URLSearchParams(location.search);

  if (q.get('season') && SEASONS[q.get('season')]) setSeason(q.get('season'), true);
  if (q.get('ff')) { const n = parseFloat(q.get('ff')) / 0.05; for (let i = 0; i < n; i++) { SIM.t += 0.05; SIM.clock += 0.05 * SIM.rate; simUpdate(0.05); } for (let i = 0; i < 60; i++) updateEnv(0.05); }
  if (q.get('area') && AREAS[q.get('area')]) { areaFly(q.get('area')); if (q.get('ff')) { cam.tween.k = 0.999; updateCamera(0.01); } }
  if (q.get('sel')) { const s = SEL.find(x => x.id === q.get('sel')); if (s) { select(s); if (q.get('ff')) { cam.tween.k = 0.999; updateCamera(0.01); } } }
  if (q.get('ff')) { renderDetail(); renderTracker(); renderTable(); renderKPIs(); renderClock(); }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);
const clk = new THREE.Clock();
let uiT = 0, slowT = 0, first = true;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clk.getDelta(), 0.05);
  SIM.t += dt; SIM.clock += dt * SIM.rate;
  if (SIM.skip > 0) { const step = Math.min(SIM.skip, Math.max(SIM.skipTotal * dt / 2.6, 900 * dt)); SIM.clock += step; SIM.skip -= step; shiftTimes(step); }
